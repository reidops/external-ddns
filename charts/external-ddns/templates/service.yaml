{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "external-ddns.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-ddns.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "external-ddns.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
