image:
  repository: ghcr.io/reidops/external-ddns
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

crds:
  # Rendered on every install and upgrade. helm uninstall never removes CRDs.
  install: true

replicaCount: 1
leaderElect: true
# Upper bound on one observation round.
observeTimeout: 10s
extraArgs: []

# Render one PublicAddress from values. spec is passed through verbatim.
publicAddress:
  enabled: false
  name: site
  spec: {}

metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # Fires when no round has corroborated the published address for this long.
    staleAfter: 15m
    # Fires when rounds keep disagreeing or falling short for this long.
    uncorroboratedFor: 10m

serviceAccount:
  create: true
  annotations: {}
  name: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
