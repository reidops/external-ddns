# Cut the version. No tests: a commit on main came through a PR whose CI
# passed on the same tree.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    # semantic-release pushes "chore(release): x.y.z [skip ci]" back to main.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Not GITHUB_TOKEN: it cannot push to a protected branch, and a release
      # it creates triggers no workflow, so publish.yml would never run. An
      # installation token can do both. It lives for this run, belongs to no
      # person, and the organisation ruleset names the app as a bypass actor.
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The three extra plugins are referenced by .releaserc.json and are not
      # bundled with semantic-release.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: >-
          npx --yes
          -p semantic-release
          -p @semantic-release/changelog
          -p @semantic-release/exec
          -p @semantic-release/git
          semantic-release
