# Branch validation, from reidops/ci-templates (its CONTRACT.md is the spec).
# Every arm is a make target here: lint (verify + golangci-lint), test,
# test-integration (envtest), helm-lint, e2e (Kind, against the image CI
# built). c-toolchain: make test is go test -race, which needs a compiler
# the runner image does not carry yet.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: reidops/ci-templates/.github/workflows/ci.yml@v0.5.0
    with:
      images: |
        {"name": "external-ddns"}
      helm-chart: charts/external-ddns
      test-integration: true
      c-toolchain: true
