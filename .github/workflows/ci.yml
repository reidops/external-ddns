# Branch validation. Nothing here publishes.
#
# A push covers our own work: the head was checked before the pull request
# existed. A fork's push never reaches this repository, so its pull request is
# the only event carrying that code, and the trigger exists for that case.
name: CI

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  # Anchors are not supported here, so the ignore list is repeated.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  # A pull request and the push of its head are separate runs; only a run of
  # the same kind supersedes its predecessor.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Test Go
    # A branch in this repository was checked on its push; running the graph
    # again for the pull request would only duplicate it. e2e and docker need
    # this job, so skipping it skips them too.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Debian, not alpine: actions/checkout needs glibc. The container is the
    # toolchain, so no setup-go.
    container: golang:1.26
    env:
      # Drift between go.mod, this image and the Dockerfile must fail, not
      # download a toolchain.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      # Container user differs from the runner's; git otherwise refuses the
      # workspace and `make verify` cannot diff.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify generated artifacts
        run: make verify

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Test integration
        run: make test-integration

      - name: Lint and render the Helm chart
        run: make helm-lint

  e2e:
    name: Test E2E
    needs: go
    # Not in a container: Kind needs the runner's docker daemon.
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Test e2e
        run: make test-e2e

  docker:
    name: Build Image
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Both platforms, as a release publishes. The Dockerfile cross-compiles,
      # so no emulation is needed.
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
