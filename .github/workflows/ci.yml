# Branch validation. Nothing here publishes.
#
# A push covers our own work: the head was checked before the pull request
# existed. A fork's push never reaches this repository, so its pull request is
# the only event carrying that code, and the trigger exists for that case.
#
# The graph itself is test.yml, which a release runs too.
name: CI

on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      # Read by GitHub and by semantic-release, never by the graph.
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.releaserc.json'
  # Anchors are not supported here, so the ignore list is repeated.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      # Read by GitHub and by semantic-release, never by the graph.
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.releaserc.json'
  workflow_dispatch:

concurrency:
  # A pull request and the push of its head are separate runs; only a run of
  # the same kind supersedes its predecessor.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    # A branch in this repository was checked on its push; running the graph
    # again for the pull request would only duplicate it. docker needs this
    # job, so skipping it skips that too.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  docker:
    name: Build Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Both platforms, as a release publishes. The Dockerfile cross-compiles,
      # so no emulation is needed.
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
