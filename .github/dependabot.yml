# One pull request per scan per ecosystem, never one per dependency. Every
# bump pushes a branch, and a branch runs the whole graph with e2e in it, so
# nine separate bumps spend hours of runner time proving the same tree nine
# times.
#
# Weekly throughout: none of it is urgent between releases. The three-day
# cooldown keeps a package's own churn from arriving one release at a time.
#
# Each ecosystem declares the group twice. A group applies to version updates
# unless it says otherwise, so a security update is opened one dependency at a
# time until a second group claims it. Security updates ignore the schedule and
# the cooldown, as they should.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
    cooldown:
      default-days: 3
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
