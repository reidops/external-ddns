# This rule is not used by the project external-ddns itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ddns.reidops.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: external-ddns
    app.kubernetes.io/managed-by: kustomize
  name: publicaddress-editor-role
rules:
- apiGroups:
  - ddns.reidops.com
  resources:
  - publicaddresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ddns.reidops.com
  resources:
  - publicaddresses/status
  verbs:
  - get
