# This rule is not used by the project external-ddns itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ddns.reidops.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: external-ddns
    app.kubernetes.io/managed-by: kustomize
  name: publicaddress-viewer-role
rules:
- apiGroups:
  - ddns.reidops.com
  resources:
  - publicaddresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ddns.reidops.com
  resources:
  - publicaddresses/status
  verbs:
  - get
