apiVersion: ddns.reidops.com/v1alpha1
kind: PublicAddress
metadata:
  name: site
spec:
  interval: 60s
  corroboration:
    requiredRounds: 3
  observers:
    - name: gateway
      unifi:
        url: https://192.0.2.1
        site: default
        insecureSkipVerify: true
        apiKeySecretRef:
          namespace: external-ddns
          name: unifi
          key: api-key
    - name: stun
      stun:
        servers:
          - stun.l.google.com:19302
          - stun.cloudflare.com:3478
    - name: echo
      http:
        url: https://api.ipify.org
  publish:
    dnsEndpoint:
      namespace: external-ddns
      name: site
    ttl: 300
    records:
      - "*.example.com"
      - vpn.example.com
